services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: abonnements
      POSTGRES_PASSWORD: abonnements
      POSTGRES_DB: abonnements
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abonnements -d abonnements"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  donnees-postgres:
